name: scOmnom_env

channels:
  # Keep this ordering to make sure PyTorch + CUDA resolve cleanly
  - pytorch
  - nvidia
  - conda-forge
  - bioconda
  - defaults

dependencies:
  # Python / tooling
  - python=3.11.14
  - pip=25.3
  - setuptools=80.9.0
  - wheel=0.45.1
  - cython=3.2.4
  - pillow=12.1.0

  # Numeric stack
  - numpy=2.3.5
  - scipy=1.15.3
  - pandas=2.3.3
  - matplotlib=3.10.8
  - seaborn=0.13.2
  - joblib=1.5.3
  - h5py=3.15.1
  - scikit-learn=1.8.0
  - psutil=7.2.1
  - statsmodels=0.14.6
  - xlsxwriter=3.2.9

  # Scanpy ecosystem
  - scanpy=1.11.5
  - numba=0.63.1
  - llvmlite=0.46.0
  - anndata=0.12.7
  - zarr=3.1.5
  - numcodecs=0.16.5
  - zstandard=0.25.0
  - igraph
  - python-igraph=1.0.0
  - leidenalg=0.11.0
  - scrublet=0.2.3
  - kneed=0.8.5
  - typer=0.21.1
  - pydantic=2.12.5
  - bbknn=1.6.0
  - gseapy=1.1.11
  # These are also requested by pip; keep both stages aligned.
  - umap-learn=0.5.11
  - requests=2.32.5
  - annotated-types=0.8.0
  - imageio=2.38.0
  - lazy-loader=0.6
  - tifffile=2026.3.3
  - typing-inspection=0.4.4

  # PyTorch / Lightning
  - pytorch::pytorch=2.5.1=py3.11_cuda12.4_cudnn9.1.0_0
  - pytorch::torchvision=0.20.1=py311_cu124
  - pytorch::torchaudio=2.5.1=py311_cu124
  - pytorch-lightning=2.6.0
  - torchmetrics=1.8.2
  - pytorch::pytorch-cuda=12.4=hc786d27_7
  # Auxiliary packages in the tested HPC stack; PyTorch uses CUDA 12.4.
  - nvidia::cuda-version=13.1=hd92462c_3
  - nvidia::cuda-opencl=13.1.115=h4f1e1d6_0

  # Testing
  - pytest=9.0.2

  # R runtime for NicheNet backend
  - r-base
  - r-devtools
  - r-rcpphnsw
  - r-uwot
  - r-seurat
  - r-seuratobject
  - r-jsonlite
  - r-tidyverse
  - r-dplyr
  - r-purrr
  - r-readr
  - r-tibble
  - r-fdrtool
  - r-hmisc
  - r-caret
  - r-randomforest
  - r-diagrammer
  - r-mlrmbo
  - r-parallelmap
  - r-emoa
  - r-e1071
  - r-ggpubr
  - r-circlize
  - bioconductor-complexheatmap
  - r-ggnewscale
  - r-ggforce
  - r-shadowtext

  # Preserve the HPC Python stack during the pip stage.
  - pip:
      - -c constraints_linux.txt
      - scvi-tools==1.4.1
      - lightning==2.6.0
      - jax==0.8.2
      - jaxlib==0.8.2
      - scanorama==1.7.4
      - harmonypy==0.2.0
      - scib-metrics==0.5.7
      - celltypist==1.7.1
      - decoupler==2.1.3
      - umap-learn==0.5.11
      - requests==2.32.5
      - types-pytz==2025.2.0.20251108
      - pydeseq2==0.5.4
      - pertpy==1.0.3
      - pybiomart==0.2.0
      - liana==1.7.1
      - git+https://github.com/kaifuchenlab/MEBOCOST.git@3e0be6f638b71c0f5bd08cef8b1448ae5230560e
